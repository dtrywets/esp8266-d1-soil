[platformio]
default_envs = d1_mini
extra_configs =
  optional ota_upload.ini

; Firmware-Bins für webflash/: ./scripts/build-webflash.sh

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
monitor_filters = direct
build_flags =
  -std=gnu++17
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson

[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = 192.168.20.55
; Host-IP in ota_upload.ini überschreiben (ip route get <ESP-IP>)
upload_flags =
  --host_ip=192.168.88.88

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_flags =
  -std=gnu++17
  -DCONFIG_BOARD_ESP32C3=1
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson

[env:esp32c3_ota]
extends = env:esp32c3
upload_protocol = espota
upload_port = 192.168.20.55
upload_flags =
  --host_ip=192.168.88.88
